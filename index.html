<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F8F5F1">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="在庫確認">
<title>在庫確認</title>
<style>
:root{
  color-scheme: light;
  --bg:#F8F5F1;
  --surface:#FFFFFF;
  --surface-2:#F2EDE7;
  --surface-3:#E8E0D7;
  --line:#E4DCD3;
  --line-strong:#CDC1B4;
  --text:#2A2421;
  --text-2:#6B615A;
  --text-3:#776D65;
  --brand:#6B4436;
  --brand-press:#553429;
  --brand-soft:#F3EAE4;
  --fresh:#EBDCD2;
  --ok:#276B43;
  --ok-bg:#EAF5EE;
  --ok-line:#A7D3B8;
  --warn:#A84B08;
  --warn-bg:#FFF0E3;
  --warn-line:#EFB07C;
  --unit:#7F5D00;
  --unit-bg:#FFF7D6;
  --unit-line:#E2C55E;
  --todo-line:#DDD4CB;
  --danger:#B3261E;
  --danger-line:#E3B5B1;
  --shadow:0 1px 2px rgba(60,40,30,.06),0 2px 8px rgba(60,40,30,.04);
  --sa-t:env(safe-area-inset-top,0px);
  --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px);
  --sa-r:env(safe-area-inset-right,0px);
  --gut-l:max(20px,var(--sa-l));
  --gut-r:max(20px,var(--sa-r));
  --top-h:150px;
  --foot-h:92px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);touch-action:manipulation}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  font-size:17px;line-height:1.5;font-feature-settings:"palt" 1;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overflow-x:hidden}
html.lock,html.lock body{overflow:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
input,textarea{font:inherit;font-size:17px;color:var(--text);-webkit-user-select:text;user-select:text}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:12px;font-size:18px;font-weight:600;border:1.5px solid transparent;text-align:center;line-height:1.3;transition:background-color .12s ease-out,opacity .12s ease-out}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:active{background:var(--brand-press)}
.btn.secondary{background:var(--surface);color:var(--brand);border-color:var(--line-strong)}
.btn.secondary:active{background:var(--surface-2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-outline{background:var(--surface);color:var(--danger);border-color:var(--danger-line)}
.btn.danger-outline:active{background:#FBEDEC}
.btn.ghost{min-height:48px;padding:0 12px;color:var(--brand)}
.btn.ghost:active{background:var(--surface-2)}
.btn.sm{min-height:44px;padding:0 16px;font-size:16px}
.btn:disabled{opacity:.45}
.icon-btn{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--text-2);flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn:disabled{opacity:.3}
.icon-btn.danger{color:var(--danger)}

/* start */
.start{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(32px + var(--sa-t)) var(--gut-r) calc(32px + var(--sa-b)) var(--gut-l)}
.start-in{width:min(520px,100%);display:grid;gap:24px;justify-items:center;text-align:center}
.start h1{font-size:28px;font-weight:700}
.start .today{font-size:20px;color:var(--text-2);margin-top:-12px}
.btn.big{min-height:84px;width:100%;font-size:22px;border-radius:16px}
.resume{width:100%;display:grid;gap:12px;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.resume p{line-height:1.7;margin-bottom:4px}

/* main header */
.main-top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + var(--sa-t)) var(--gut-r) 12px var(--gut-l)}
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:60px}
.date-btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;margin-left:-12px;border-radius:12px;font-size:18px;font-weight:600;white-space:nowrap}
.date-btn:active{background:var(--surface-2)}
.date-btn svg{color:var(--text-2)}
.prog{flex:1 1 120px;min-width:100px;display:grid;gap:8px}
.prog-txt{display:flex;align-items:baseline;gap:8px;font-size:15px;color:var(--text-2);white-space:nowrap}
.prog-txt b{font-size:24px;color:var(--text);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:4px;transform-origin:left center;transition:transform .2s ease-out}
.buy-chip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;white-space:nowrap}
.buy-chip b{font-size:20px}
.buy-chip.on{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.buy-chip .mis{font-size:14px;color:var(--unit);font-weight:600}
@media (max-width:860px){
  .hdr{gap:8px}
  .date-btn svg{display:none}
  .hdr .seg button{padding:0 12px}
  .buy-chip{padding:0 12px}
}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-size:16px;font-weight:600;color:var(--text-2);white-space:nowrap}
.chip .c{font-weight:400;font-variant-numeric:tabular-nums}
.chip:active{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.seg{display:inline-flex;background:var(--surface-3);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:44px;padding:0 16px;border-radius:9px;font-size:16px;font-weight:600;color:var(--text-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.locjump{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.locjump .chip{color:var(--text);background:var(--surface-2);border-color:transparent}
.locjump .chip svg{width:18px;height:18px;color:var(--text-2);margin-right:-4px}

/* list */
.list{padding:20px var(--gut-r) calc(var(--foot-h) + 32px + var(--sa-b)) var(--gut-l)}
.sec{scroll-margin-top:calc(var(--top-h) + 12px)}
.sec + .sec{margin-top:32px}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:0 0 12px;font-size:20px;font-weight:700}
.sec-h .cnt{font-size:15px;font-weight:400;color:var(--text-2)}
.sec-h .tot{margin-left:auto;font-size:17px;font-weight:600}
.sec-h .tot b{font-size:22px}
.sec-h .tot small{font-size:14px;font-weight:400;color:var(--text-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.empty{padding:48px 0;text-align:center;color:var(--text-2)}

/* card */
.card{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:12px;align-items:center;align-content:center;width:100%;min-height:88px;padding:16px;text-align:left;background:var(--surface);border:1.5px solid var(--todo-line);border-radius:16px;box-shadow:var(--shadow);transition:opacity .1s ease-out;scroll-margin-top:calc(var(--top-h) + 12px);scroll-margin-bottom:calc(var(--foot-h) + 16px + var(--sa-b))}
/* 1行目：名前と状態（短い）、2行目：保管場所と数量。行ごとに幅を決めるので、名前に幅を多く取れる */
.c-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.c-row{display:flex;align-items:baseline;gap:8px;min-width:0}
.c-row .c-name,.c-row .c-sub{flex:1;min-width:0}
.c-row .c-st,.c-row .c-qty{flex:none}
/* 写真のある項目は、状態の丸の位置に写真を置き、状態の印は写真の右下に重ねる（名前の幅を狭めない） */
.card.has-ph{grid-template-columns:44px minmax(0,1fr)}
.c-phwrap{position:relative;width:44px;height:44px;align-self:center}
.c-ph{display:block;width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.card:active{opacity:.7}
.c-ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--todo-line)}
.c-ic svg{width:20px;height:20px;stroke-width:3}
.c-phwrap .c-ic{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;background:var(--surface);box-shadow:0 0 0 2px var(--surface)}
.c-phwrap .c-ic svg{width:14px;height:14px}
.c-name{font-size:19px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.c-qty{font-size:24px;font-weight:700;text-align:right;white-space:nowrap;line-height:1.2}
.c-qty .dash{color:var(--line-strong);font-weight:400}
.c-qty .prev{font-size:16px;font-weight:600;color:var(--text-3)}
.c-sub{align-self:center;font-size:14px;color:var(--text-2);line-height:1.45;overflow-wrap:anywhere}
.c-st{font-size:14px;font-weight:600;text-align:right;white-space:nowrap;color:var(--text-3)}
.c-need{align-self:flex-start;margin-top:4px;padding:4px 12px;border-radius:8px;font-size:15px;font-weight:700;color:var(--warn);background:var(--surface);border:1.5px solid var(--warn-line)}
.c-need.mis{color:var(--unit);border-color:var(--unit-line)}
.st-partial .c-ic{border:2px dashed var(--ok)}
.st-partial .c-st{color:var(--ok)}
.st-done{background:var(--ok-bg);border-color:var(--ok-line)}
.st-done .c-ic{background:var(--ok);border-color:var(--ok);color:#fff}
.st-done .c-st{color:var(--ok)}
.st-short{background:var(--warn-bg);border-color:var(--warn-line)}
.st-short .c-ic{background:var(--warn);border-color:var(--warn);color:#fff}
.st-short .c-st{color:var(--warn)}
.st-mismatch{background:var(--unit-bg);border-color:var(--unit-line)}
.st-mismatch .c-ic{background:var(--unit);border-color:var(--unit);color:#fff}
.st-mismatch .c-st{color:var(--unit)}

/* action bar */
.action-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:12px;padding:12px var(--gut-r) calc(12px + var(--sa-b)) var(--gut-l);background:var(--surface);border-top:1px solid var(--line)}
.action-bar .btn{flex:1;min-height:64px;font-size:19px}
.action-bar .btn.grow{flex:1.4}

/* generic header bar for sub screens */
.top-wrap{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:var(--sa-t) var(--gut-r) 0 var(--gut-l)}
.bar-hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:64px}
.bar-hdr .btn.ghost{justify-self:start;margin-left:-12px;font-size:17px}
.bar-hdr h1{font-size:20px;font-weight:700;text-align:center}
.set-tabs{margin:0 0 12px}

/* report */
.rp{max-width:760px;margin:0 auto;padding:20px var(--gut-r) calc(var(--foot-h) + 32px + var(--sa-b)) var(--gut-l);display:grid;gap:20px}
.rp > div:empty{display:none}
.warn-box{display:grid;gap:12px;padding:16px 20px;border:1.5px solid var(--warn-line);background:var(--warn-bg);border-radius:16px;line-height:1.7}
.warn-box .names{font-size:15px;color:var(--text-2)}
.warn-box.mis-box{border-color:var(--unit-line);background:var(--unit-bg)}
.warn-box .btn{justify-self:start}
.note{font-size:15px;color:var(--text-2);line-height:1.7}
.rp-text{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 24px;white-space:pre-wrap;font-size:17px;line-height:1.75;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.rp-end{display:grid;gap:12px;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.rp-end h2{font-size:18px}
.rp-end .btn{justify-self:start}
.copied{font-size:15px;color:var(--ok);font-weight:600}
.sync-st{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:15px;color:var(--text-2);line-height:1.6}
.sync-st.ok{color:var(--ok);font-weight:600}
.sync-st.err{color:var(--danger);font-weight:600}
.sync-st .btn{font-weight:600}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:calc(12px + var(--sa-t)) max(12px,var(--sa-r)) 0 max(12px,var(--sa-l));background:rgba(42,36,33,.42);overscroll-behavior:contain;animation:fade .15s ease-out}
.sheet{width:min(640px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 24px calc(20px + var(--sa-b));animation:rise .18s ease-out}
.sheet.small{width:min(520px,100%)}
.sheet.form{width:min(720px,100%);display:flex;flex-direction:column;padding:0;overflow:hidden;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px - var(--sa-t))}
.sheet.form .sh-head{padding:16px 24px 12px;border-bottom:1px solid var(--line)}
.sheet.form .form-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 24px 24px;display:grid;gap:20px;align-content:start}
.sheet.form .sh-foot{padding:12px 24px calc(12px + var(--sa-b));border-top:1px solid var(--line);margin:0}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes swapIn{from{opacity:.25}to{opacity:1}}
.sh-head{display:flex;align-items:center;gap:12px;min-height:48px}
.sh-head h2{flex:1;font-size:20px;font-weight:700;line-height:1.4}
.sh-foot{display:flex;gap:12px;margin-top:20px}
.sh-foot .btn{flex:1;min-height:60px}
.cf-body{margin-top:8px;line-height:1.75}
.cf-body .warn-t{color:var(--warn)}
.cf-body .names{display:block;margin-top:8px;font-size:15px;color:var(--text-2)}

/* input sheet */
.sheet.input{padding:16px 24px calc(16px + var(--sa-b))}
.in-head{display:flex;align-items:flex-start;gap:8px}
.in-title{flex:1;min-width:0}
.in-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:15px;color:var(--text-2);min-height:28px}
.loc-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px 4px 8px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.loc-tag svg{width:18px;height:18px}
.loc-tag.none{background:var(--surface-2);color:var(--text-2)}
.in-remain{margin-left:auto}
.in-name{margin-top:4px;font-size:28px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.in-memo{margin-top:4px;font-size:15px;color:var(--text-2);line-height:1.6}
.in-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.in-tab{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600}
.in-tab .q{font-weight:400;color:var(--text-2)}
.in-tab.done .q{color:var(--ok);font-weight:600}
.in-tab[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.in-body{display:grid;gap:16px;margin-top:16px}
.in-left{display:grid;gap:12px;align-content:start}
.in-disp{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;gap:12px}
.step{min-height:76px;border-radius:14px;background:var(--surface-2);font-size:22px;font-weight:700;color:var(--text)}
.step:active,.key:active{background:var(--surface-3)}
.val{display:flex;align-items:center;justify-content:center;gap:8px;min-height:76px;padding:8px 12px;border-radius:14px;border:2px solid var(--line-strong);background:var(--surface);overflow:hidden}
.val .v{font-size:42px;font-weight:700;line-height:1.1;padding:2px 8px;border-radius:8px;white-space:nowrap}
.val.fresh .v{background:var(--fresh)}
.val .u{font-size:22px;font-weight:600;color:var(--text-2);white-space:nowrap}
.val .ph{font-size:20px;color:var(--text-3)}
.val .carry{padding:4px 8px;border-radius:8px;background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600;line-height:1.3;text-align:center}
.units{display:flex;flex-wrap:wrap;gap:8px}
.unit{min-width:76px;min-height:56px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:20px;font-weight:600}
.unit:active{background:var(--surface-2)}
.unit[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.units.err .unit:not([aria-pressed="true"]){border-color:var(--danger)}
.u-msg{margin-top:8px;font-size:15px;color:var(--text-2)}
.u-msg.err{color:var(--danger);font-weight:600}
.calc{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:12px 16px;border-radius:12px;background:var(--surface-2);font-size:17px;line-height:1.5;min-height:52px}
.calc .muted{color:var(--text-2)}
.calc b{font-variant-numeric:tabular-nums}
.calc .need{color:var(--warn);font-weight:700}
.calc .ok{color:var(--ok);font-weight:600}
.calc .mis{color:var(--unit);font-weight:600}
.calc .undo{margin-left:auto;align-self:center;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:68px;gap:8px}
.key{border-radius:12px;background:var(--surface-2);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.key.fn{font-size:18px;color:var(--text-2)}
.key.zero{grid-column:span 2}
.key.none{grid-row:span 2;flex-direction:column;gap:2px;background:var(--surface);border:2px solid var(--line-strong);font-size:19px;font-weight:700;color:var(--text);line-height:1.3}
.key.none small{font-size:14px;font-weight:400;color:var(--text-2)}
.key.none:active{background:var(--surface-2)}
.key.none.half{grid-row:auto;font-size:17px;gap:0}
.key.none.half small{font-size:13px}
.in-ph{flex:none;width:88px;height:88px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin-right:4px}
.in-ph img{width:100%;height:100%;object-fit:cover;display:block}
.in-ph.add{border:1.5px dashed var(--line-strong);color:var(--text-2);font-size:14px;font-weight:600;width:72px;height:72px}
.in-ph.add:active{background:var(--surface-3)}
.viewer-img{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:12px;background:var(--surface-2);margin-top:12px}
.ph-field{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.ph-field img{width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.ph-field .ph-none{width:120px;height:120px;border-radius:12px;border:1.5px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:14px}
.key:disabled{opacity:.3}
.in-foot{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:16px}
.in-foot .btn{min-height:64px;font-size:19px}
.swap{animation:swapIn .2s ease-out}
@media (orientation:landscape) and (min-width:900px){
  .overlay{align-items:center;padding-bottom:calc(12px + var(--sa-b))}

  .in-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}

}

  .in-name{font-size:24px}

  .unit{min-height:52px}

.set-sec .sec-h{margin-bottom:8px}
.set-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:8px;min-height:64px;padding:8px 12px 8px 16px}
.set-row + .set-row{border-top:1px solid var(--line)}
.set-row.off .nm{color:var(--text-3)}
.set-main{flex:1;min-width:0;display:grid;gap:2px;text-align:left;padding:4px 0;min-height:48px;align-content:center}
button.set-main:active{opacity:.6}
.set-main .nm{font-size:18px;font-weight:600;overflow-wrap:anywhere}
.set-main .meta{font-size:14px;color:var(--text-2);line-height:1.5}
.tag-off{display:inline-block;margin-left:8px;padding:0 8px;border-radius:6px;background:var(--surface-3);color:var(--text-2);font-size:13px;font-weight:600;vertical-align:2px}
.chev{color:var(--line-strong)}
.data-sec{display:grid;gap:12px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.data-sec h2{font-size:18px}
.data-sec .row{display:flex;flex-wrap:wrap;gap:12px}
.fld{display:grid;gap:8px}
.lbl{font-size:15px;font-weight:600;color:var(--text-2)}
.txt{width:100%;min-height:52px;padding:12px 16px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);font-size:18px}
.txt:focus{outline:2px solid var(--brand);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:48px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:17px;font-weight:600}
.opt:active{background:var(--surface-2)}
.opt[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.fixed{min-height:48px;display:flex;align-items:center;color:var(--text-2)}
.req-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.req-row .txt{width:120px;text-align:center;font-size:20px;font-weight:600}
.step.sm{min-height:52px;width:64px;font-size:18px}
.err{color:var(--danger);font-size:15px;font-weight:600}
.switch{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:600}
.switch input{width:28px;height:28px;accent-color:var(--brand);margin:0}
.sub-h{font-size:16px;font-weight:700;color:var(--text-2);margin:8px 0 4px}
.manual{width:100%;min-height:40vh;padding:16px;border:1.5px solid var(--line-strong);border-radius:12px;font-size:16px;line-height:1.6;resize:none;margin-top:12px}
.date-pick{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
.date-pick .icon-btn{width:64px;height:64px;background:var(--surface-2)}
.dp-val{min-width:220px;text-align:center;font-size:22px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(var(--foot-h) + 16px + var(--sa-b));transform:translateX(-50%);z-index:200;width:max-content;max-width:min(600px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:12px;background:#2F2825;color:#fff;font-size:17px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:fade .15s ease-out;pointer-events:none}

/* スプレッドシートの「在庫管理」シート（商品名・在庫数・発注目安・単位・保管場所…）に合わせて、項目ごとの値を送る。

      var L = latestOf(it);
      var row = { name: it.name, aliases: NAME_ALIASES[it.id] || [], cat: CAT_LABEL[c], stock: '未確認', unit: '', target: '', loc: keysOf(it).map(lName).join('・'), need: '', date: '' };
      if (it.cat !== 'cash') row.target = it.req ? fmtN(it.req.q) + uName(it.req.u) : (/発注目安：当日/.test(it.memo || '') ? '当日' : '');
      if (L) {

        if (r.es.some(function (e) { return e && e.src === 'sheet'; })) row.date += '（事務所で変更）';

          row.need = r.st === 'short' ? '購入 ' + fmtN(r.need) + uName(it.req.u) : r.st === 'mismatch' ? '単位の確認が必要' : '';

/* ---------- 事務所のパソコンでスプレッドシートの在庫数を直したときの取り込み ---------- */
/* 比べるための文字（全角→半角、カンマと空白を除く）。Apps Script の key_ と同じ決まり */
function normSheet(v) {
  var s = String(v === null || v === undefined ? '' : v);
  return (s.normalize ? s.normalize('NFKC') : s).replace(/[,\s]/g, '');
}
function sheetKey(stock, unit) { return normSheet(stock) + '|' + normSheet(unit); }

function itemByName(name) { for (var i = 0; i < M.items.length; i++) if (M.items[i].name === name) return M.items[i]; return null; }

function parseSheetValue(it, stock, unit) {
  var s = normSheet(stock), m;
  if (it.cat === 'cash') {
    m = s.match(/^(\d+)(円|枚)?$/);
    return m ? { q: +m[1], u: null } : null;
  }
  m = s.match(/^(\d+(?:\.\d+)?)([^\d.]*?)(以上)?$/);
  if (!m) return null;
  var q = r2(parseFloat(m[1])), un = m[2] || normSheet(unit), u = un ? unitIdOf(un) : defUnit(it);
  if (un && !u) return null;                 // 登録されていない単位
  if (m[3] && !it.atLeast) return null;      // 「〇以上」は6袋以上でまとめる備品だけ
  if (q > 0 && !u) return null;
  if (it.atLeast && q > it.atLeast) q = it.atLeast;
  return { q: q, u: u || null };
}
/* 取り込んだ数量を入れる。今回の在庫確認で入力済みならその数量を、まだなら「前回」の数量を置き換える。
   保管場所が2か所ある項目は、1つ目の場所に合計を入れ、ほかの場所は0にする */
function putImported(it, v) {
  var ks = keysOf(it), useCur = !!S && ks.some(function (k) { return getE(it.id, k); });
  var map = useCur ? S.entries : P.entries, today = todayStr();
  map[it.id] = {};
  ks.forEach(function (k, i) {
    var e = { q: i === 0 ? v.q : 0, u: v.u, src: 'sheet' };
    if (useCur) e.t = Date.now(); else e.d = today;
    map[it.id][k] = e;
  });
  if (useCur) saveSession(); else savePrev();
}
/* rows：Apps Script の read が返す [{name, stock, unit}]。戻り値 {changed:[名前], failed:[名前], dirty:真偽} */
function importFromSheet(rows) {
  var mine = {}, got = { changed: [], failed: [], dirty: false };
  syncItems().items.forEach(function (r) { mine[r.name] = sheetKey(r.stock, r.unit); });
  // 前の版から更新した iPad が初めて読むとき：前の版ではシートに iPad の数を書いていたので、
  // iPad の数と違う値は事務所で直されたものとして扱う（iPad にまだ送っていない入力があるときは iPad を優先）
  var upgraded = !SY.seen;
  if (upgraded) SY.seen = {};
  rows.forEach(function (row) {
    var it = itemByName(String(row.name || ''));
    if (!it || !it.active) return;
    var cur = sheetKey(row.stock, row.unit), known = SY.seen[it.name];
    if (known === undefined && upgraded && !SY.pending) known = mine[it.name];
    SY.seen[it.name] = cur;
    if (known === undefined || cur === known) return;    // 初めて見た行・事務所で直されていない行
    got.dirty = true;                                     // 確認日などを書き直すため、あとで送る
    var local = mine[it.name];
    if (local === cur) return;                            // iPad と同じ数
    if (local !== known) return;                          // iPad にまだ送っていない入力がある → iPad の数を優先
    var s = normSheet(row.stock);
    if (s === '' || s === '未確認') return;               // 消された・未確認 → iPad の数に戻す
    var v = parseSheetValue(it, row.stock, row.unit);
    if (!v) { got.failed.push(it.name); return; }
    var unitLbl = it.cat === 'cash' ? (it.kind === 'yen' ? '円' : '枚') : uName(v.u);
    if (sheetKey(it.atLeast && v.q >= it.atLeast ? it.atLeast + '以上' : v.q, unitLbl) === local) return;   // 書き方が違うだけ
    putImported(it, v);
    got.changed.push(it.name);
  });
  saveSync();
  return got;
}
var pullP = null, lastPull = 0;
function pullSheet(force) {
  if (!syncOn() || navigator.onLine === false) return Promise.resolve(null);
  if (pullP) return pullP;
  if (!force && Date.now() - lastPull < 20000) return Promise.resolve(null);
  pullP = fetch(syncUrl() + '&action=read', { cache: 'no-store' })
    .then(function (res) { return res.json(); })
    .then(function (j) {
      lastPull = Date.now();
      if (!j || !j.ok || !Array.isArray(j.items)) return null;   // 読み込みに対応していない Apps Script
      return importFromSheet(j.items);
    })
    .catch(function () { return null; })
    .then(function (got) { pullP = null; return got; });

}
function nameList(a) { return a.slice(0, 3).join('、') + (a.length > 3 ? ' ほか' + (a.length - 3) + '件' : ''); }
function afterPull(got, inSync) {
  if (!got) return;
  if (got.changed.length || got.failed.length) {
    if (screen === 'main') renderMain(); else if (screen === 'report') renderReport();
    var msg = got.changed.length ? '事務所で変更された在庫数を取り込みました（' + nameList(got.changed) + '）' : '';
    if (got.failed.length) msg += (msg ? '。' : '') + '読み取れない在庫数はiPadの数のままにします（' + nameList(got.failed) + '）';

function queueSync(delay) {

function runSync() {

  syncBusy = true;
  var rev = syncRev;
  renderSyncStatus();
  // 送る前に、事務所のパソコンで直された在庫数を取り込む（取り込まずに送ると上書きしてしまうため）
  return pullSheet(true)
    .then(function (got) {
      afterPull(got, true);
      return fetch(syncUrl(), { method: 'POST', body: JSON.stringify(syncPayload()) });
    })
    .then(function (res) { return res.json(); })
    .then(function (j) {
      if (!j || !j.ok) throw new Error(j && j.error === 'key' ? '合言葉が違うため、反映できませんでした' : 'スプレッドシートに書き込めませんでした');

      if (SY.seen && j.written) Object.keys(j.written).forEach(function (n) { SY.seen[n] = j.written[n]; });
      if (Array.isArray(j.skipped) && j.skipped.length) SY.pending = true;   // 送っている間に事務所で直された → 取り込んでから送り直す
      else if (rev === syncRev) SY.pending = false;
    }, function (e) { throw e; })
    .catch(function (e) { SY.lastErr = e && /合言葉|書き込め/.test(e.message) ? e.message : '送れませんでした（通信やURLを確認してください）'; })
    .then(function () {
      syncBusy = false; saveSync(); renderSyncStatus();
      if (SY.pending && !SY.lastErr) queueSync(1000);   // 送っている間に数量が変わったら、もう一度送る

    });
}
function syncStatusText() {
  if (!syncOn()) return '';
  if (syncBusy) return 'スプレッドシートへ送信中…';
  if (SY.lastErr) return SY.lastErr;
  if (SY.pending) return 'まもなくスプレッドシートに反映します';
  return SY.lastOk ? 'スプレッドシートに反映済み（' + fmtStamp(SY.lastOk) + '）' : '';
}

    var el = $(sel); if (!el) return;
    var t = syncStatusText();
    el.hidden = !t;
    el.className = 'sync-st' + (SY.lastErr ? ' err' : SY.pending || syncBusy ? '' : ' ok');
    el.innerHTML = esc(t) + (SY.lastErr ? ' <button class="btn ghost sm" data-act="sy-now">もう一度送る</button>' : '');
  });
}

/* ================= 写真（新人向けの見分け用） ================= */
/* 写真は端末内の IndexedDB に保存する（localStorage は容量が小さいため）。PH は表示用の写し */
var PH = {}, idb = null;
function idbOpen() {
  if (idb) return Promise.resolve(idb);
  return new Promise(function (res, rej) {
    if (!window.indexedDB) { rej(new Error('no indexedDB')); return; }
    var rq = indexedDB.open('sweetsZaiko', 1);
    rq.onupgradeneeded = function () { if (!rq.result.objectStoreNames.contains('photos')) rq.result.createObjectStore('photos'); };
    rq.onsuccess = function () { idb = rq.result; res(idb); };
    rq.onerror = function () { rej(rq.error); };
  });
}
function idbTx(mode, fn) {
  return idbOpen().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('photos', mode), out = fn(tx.objectStore('photos'));
      tx.oncomplete = function () { res(out); };
      tx.onerror = tx.onabort = function () { rej(tx.error); };
    });
  });
}
function photoLoadAll() {
  var got = {};
  return idbTx('readonly', function (st) {
    var rq = st.openCursor();
    rq.onsuccess = function () { var c = rq.result; if (c) { got[c.key] = c.value; c.continue(); } };
  }).then(function () { PH = got; });
}
function photoPut(id, url) { return idbTx('readwrite', function (st) { st.put(url, id); }).then(function () { PH[id] = url; }); }
function photoDel(id) { return idbTx('readwrite', function (st) { st.delete(id); }).then(function () { delete PH[id]; }); }
/* 撮った・選んだ写真を、長い辺 960px の JPEG に縮めて保存する */
function readPhoto(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 960 / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
function pickPhoto(cb) {
  var el = $('#ph-file');
  el.value = '';
  el.onchange = function () {
    var file = el.files && el.files[0];
    if (file) readPhoto(file).then(cb, function () { toast('写真を読み込めませんでした'); });
  };
  el.click();
}
function addPhotoFor(id, after) {
  pickPhoto(function (url) {
    photoPut(id, url).then(function () { toast('写真を登録しました', true); renderMain(); if (after) after(); },
      function () { toast('写真を保存できませんでした'); });
  });
}
function openPhotoViewer(id) {
  var it = itemById(id); if (!it || !PH[id]) return;
  var L = openLayer('<div class="sh-head"><h2>' + esc(it.name) + '</h2><button class="icon-btn" data-a="close" aria-label="閉じる">' + ico('close') + '</button></div>' +

    '<div class="sh-foot"><button class="btn ghost" data-a="del">写真を削除</button><button class="btn secondary" data-a="change">' + ico('camera') + '写真を変更</button><button class="btn primary" data-a="close">閉じる</button></div>', 'small', {

        photoDel(id).then(function () { L.close(); renderMain(); if (inp && inp.id === id) renderInput(); toast('写真を削除しました', true); }, function () {});

}

  document.body.appendChild(ta);

function backupName() { return 'zaiko-settings-' + todayStr().replace(/-/g, '') + '.json'; }
function parseBackup(text) {
  var o; try { o = JSON.parse(text); } catch (e) { return null; }
  if (!o || typeof o !== 'object') return null;
  if (o.app && o.app !== APP_ID) return null;
  var m = normMaster(o.master || o);
  if (!m) return null;
  var photos = {};
  if (o.photos && typeof o.photos === 'object') Object.keys(o.photos).forEach(function (k) { if (isStr(o.photos[k]) && /^data:image\//.test(o.photos[k])) photos[k] = o.photos[k]; });
  return { master: m, photos: photos };
}
function applyRestore(b) {
  var m = b.master, ids = Object.keys(b.photos);
  confirmDialog({ title: '設定を復元しますか', body: '<p>今の設定を、バックアップの内容（' + m.items.length + '項目' + (ids.length ? '・写真' + ids.length + '枚' : '') + '）に置き換えます。</p>', ok: '復元する' }, function () {
    M = m; saveMaster(); M.items.forEach(migrateEntries); renderSettings();
    ids.reduce(function (p, id) { return p.then(function () { return photoPut(id, b.photos[id]); }); }, Promise.resolve())
      .then(function () { toast('設定を復元しました', true); renderSettings(); }, function () { toast('設定は復元しましたが、写真を保存できませんでした'); });
  });
}

/* ================= 操作の受け付け ================= */
var ACT = {
  begin: beginSession,
  resume: function () { S.ack = todayStr(); saveSession(); show('main'); },
  'new-start': function () {
    if (S.copiedAt) { beginSession(); return; }
    confirmDialog({ title: '今日の在庫確認を開始しますか', body: '<p>' + fmtDate(S.date, true) + 'の報告はまだコピーされていません。今日の在庫確認を始めると、' + fmtDateShort(S.date) + 'の報告は作れなくなります。入力した数量は「前回」の数量として引き継がれます。</p>', ok: '今日の在庫確認を開始' }, beginSession);
  },
  settings: function () { show('settings'); },
  'set-back': function () { show((prevScreen === 'main' || prevScreen === 'report') && S ? prevScreen : 'start'); },
  date: openDateSheet,
  filter: function (b) { UI.filter = (UI.filter === b.dataset.f && b.id === 'h-buy') ? 'all' : b.dataset.f; saveUI(); renderMain(); window.scrollTo(0, 0); },
  view: function (b) { UI.view = b.dataset.v; saveUI(); renderMain(); window.scrollTo(0, 0); },
  jump: function (b) { var s = document.getElementById('sec-' + b.dataset.l); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  open: function (b) { openInput(b.dataset.id, b.dataset.k || null); },
  'start-next': function () { var nx = findNext(null); if (nx) openInput(nx.id, nx.k); },
  report: function () { show('report'); },
  'go-main': function () { show('main'); },
  'go-todo': function () { UI.filter = 'todo'; saveUI(); mainScrollY = 0; show('main'); },
  'go-buy': function () { UI.filter = 'buy'; saveUI(); mainScrollY = 0; show('main'); },
  key: function (b) { if (inp) pressKey(b.dataset.k); },
  unit: function (b) { if (!inp) return; inp.unit = b.dataset.u; inp.err = ''; inp.touched = true; updInput(); },
  'in-tab': function (b) { if (inp) switchTab(b.dataset.k); },
  'in-close': function () { closeInput(); },
  'ph-view': function (b) { openPhotoViewer(b.dataset.id); },
  'ph-add': function (b) { var id = b.dataset.id; addPhotoFor(id, function () { if (inp && inp.id === id) renderInput(); }); },
  'in-save-close': function () { if (commit() !== 'err') closeInput(); },
  'in-save-next': function () { if (commit() !== 'err') goNext(); },
  'in-unset': function () { delE(inp.id, inp.k); renderMain(); queueSync(); openInput(inp.id, inp.k); },
  'copy-all': function () { onCopy('all'); },
  'copy-buy': function () { onCopy('buy'); },
  end: onEnd,
  'set-tab': function (b) { UI.setTab = b.dataset.t; saveUI(); reorder = false; renderSettings(); window.scrollTo(0, 0); },
  'item-add': function () { openItemEdit(null); },
  'item-edit': function (b) { openItemEdit(b.dataset.id); },
  reorder: function () { reorder = !reorder; renderSettings(); },
  mv: function (b) { var it = itemById(b.dataset.id); if (moveIn(M.items, it, Number(b.dataset.d), function (x) { return x.cat === it.cat; })) { saveMaster(); renderSettings(); } },
  'loc-assign': function (b) { openAssign(b.dataset.id); },
  'loc-rename': function (b) {
    var l = locById(b.dataset.id);
    askText('保管場所の名前', l.name, function (v) { var e = uniqName(M.locs, v, l.id); if (e) return e; l.name = v; saveMaster(); renderSettings(); return null; });
  },
  'loc-mv': function (b) { if (moveIn(M.locs, locById(b.dataset.id), Number(b.dataset.d))) { M.items.forEach(sortLocs); saveMaster(); renderSettings(); } },
  'loc-del': function (b) {
    var l = locById(b.dataset.id), n = M.items.filter(function (it) { return it.locs.indexOf(l.id) >= 0; }).length;
    confirmDialog({ title: '「' + l.name + '」を削除しますか', body: '<p>' + (n ? n + '項目の保管場所から「' + esc(l.name) + '」が外れます。今回この場所で入力した数量も使われなくなります。' : 'この場所に設定されている項目はありません。') + '</p>', ok: '削除', okKind: 'danger' }, function () {
      M.locs.splice(M.locs.indexOf(l), 1);
      M.items.forEach(function (it) { var i = it.locs.indexOf(l.id); if (i >= 0) it.locs.splice(i, 1); });
      saveMaster(); M.items.forEach(migrateEntries); renderSettings(); toast('削除しました', true);
    });
  },
  'loc-add': function () { askText('保管場所を追加', '', function (v) { var e = uniqName(M.locs, v); if (e) return e; M.locs.push({ id: newId('l'), name: v }); saveMaster(); renderSettings(); return null; }); },
  'unit-rename': function (b) {
    var u = unitById(b.dataset.id);
    askText('単位の名前', u.name, function (v) { var e = uniqName(M.units, v, u.id); if (e) return e; u.name = v; saveMaster(); renderSettings(); return null; });
  },
  'unit-mv': function (b) { if (moveIn(M.units, unitById(b.dataset.id), Number(b.dataset.d))) { saveMaster(); renderSettings(); } },
  'unit-del': function (b) {
    var u = unitById(b.dataset.id), n = unitUse(u.id);
    if (n) { toast('「' + u.name + '」は使われているため削除できません（' + n + '件）'); return; }
    confirmDialog({ title: '「' + u.name + '」を削除しますか', body: '<p>この単位を使っている項目はありません。</p>', ok: '削除', okKind: 'danger' }, function () {
      M.units.splice(M.units.indexOf(u), 1); saveMaster(); renderSettings(); toast('削除しました', true);
    });
  },
  'unit-add': function () { askText('単位を追加', '', function (v) { var e = uniqName(M.units, v); if (e) return e; M.units.push({ id: newId('u'), name: v }); saveMaster(); renderSettings(); return null; }); },
  'bk-file': function () {
    try {
      var blob = new Blob([backupJSON(true)], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = backupName(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
      toast('バックアップファイルの保存を開始しました');
    } catch (e) { toast('ファイルを作成できませんでした。「テキストでコピー」を使ってください'); }
  },
  'bk-share': function () {
    var file = new File([backupJSON(true)], backupName(), { type: 'application/json' });
    navigator.share({ files: [file], title: '在庫確認の設定' }).then(function () { toast('共有しました', true); }, function (e) { if (!e || e.name !== 'AbortError') toast('共有できませんでした'); });
  },
  'bk-copy': function () {
    var text = backupJSON(false);
    copyText(text).then(function (ok) { if (ok) toast('設定をテキストでコピーしました', true); else openManualCopy(text, 'backup'); });
  },
  'sy-save': function () {
    var url = $('#sy-url').value.trim(), key = $('#sy-key').value.trim();
    if (!/^https?:\/\/\S+$/.test(url)) { toast('URLを確認してください（https:// から始まるURL）'); return; }
    if (!key) { toast('合言葉を入力してください'); return; }
    SY.url = url.replace(/[?&]key=[^&]*/, ''); SY.key = key; SY.lastErr = ''; SY.seen = {}; saveSync();   // つなぎ直したときは、シートの今の値を覚えるだけ（この iPad の数を書き込む）
    renderSettings();
    toast('接続を確かめています…');
    fetch(syncUrl(), { method: 'GET' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok) { toast('つながりました。在庫数を反映します', true); queueSync(0); }
      else { SY.lastErr = j && j.error === 'key' ? '合言葉が違います' : 'スプレッドシート側の設定を確認してください'; saveSync(); renderSyncStatus(); toast(SY.lastErr); }
    }, function () { SY.lastErr = 'つながりませんでした（URLと通信を確認してください）'; saveSync(); renderSyncStatus(); toast(SY.lastErr); });
  },
  'sy-now': function () { syncRev++; SY.pending = true; SY.lastErr = ''; saveSync(); runSync().then(function (ok) { toast(ok ? 'スプレッドシートに反映しました' : (SY.lastErr || '反映できませんでした'), ok); }); },
  'sy-clear': function () {
    confirmDialog({ title: '連携をやめますか', body: '<p>この iPad からスプレッドシートへの書き込みをやめます。スプレッドシートの内容は消えません。</p>', ok: '連携をやめる' }, function () {
      SY = { url: '', key: '', lastOk: null, lastErr: '', pending: false }; saveSync(); renderSettings(); toast('連携をやめました', true);
    });
  },
  'rs-file': function () { var f = $('#rs-file'); f.value = ''; f.click(); },
  'rs-text': function () {
    var L = openLayer('<div class="sh-head"><h2>テキストを貼り付けて復元</h2><button class="icon-btn" data-a="close" aria-label="閉じる">' + ico('close') + '</button></div>' +
      '<p class="note" style="margin-top:4px">「テキストでコピー」で保存した内容を貼り付けてください。</p><textarea class="manual" id="rs-ta" spellcheck="false" autocomplete="off"></textarea><p class="err" id="rs-err" hidden style="margin-top:8px">内容を読み取れませんでした。コピーした全文を貼り付けてください。</p>' +
      '<div class="sh-foot"><button class="btn secondary" data-a="close">キャンセル</button><button class="btn primary" data-a="go">復元</button></div>', '', {
      close: function () { L.close(); },
      go: function () { var m = parseBackup($('#rs-ta', L.sh).value); if (!m) { $('#rs-err', L.sh).hidden = false; return; } L.close(); applyRestore(m); }
    });
  },
  'reset-master': function () {
    confirmDialog({ title: '設定を初期状態に戻しますか', body: '<p>追加した項目、保管場所の割り当て、発注目安、単位の変更などがすべて元に戻ります。先にバックアップを取ることをおすすめします。</p>', ok: '初期状態に戻す', okKind: 'danger' }, function () {
      M = defaultMaster(); saveMaster(); M.items.forEach(migrateEntries); renderSettings(); toast('設定を初期状態に戻しました', true);
    });
  }
};
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var f = ACT[b.dataset.act];
  if (f) f(b, e);
});
$('#rs-file').addEventListener('change', function () {
  var file = this.files && this.files[0]; if (!file) return;
  var rd = new FileReader();
  rd.onload = function () { var m = parseBackup(String(rd.result)); if (!m) { toast('バックアップファイルを読み取れませんでした'); return; } applyRestore(m); };
  rd.onerror = function () { toast('ファイルを読み込めませんでした'); };
  rd.readAsText(file);
});
document.addEventListener('keydown', function (e) {
  if (!inp || layers.length || e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;
  if (/^[0-9]$/.test(k) || k === '.') pressKey(k);
  else if (k === 'Backspace') pressKey('bs');
  else if (k === 'Enter') { if (commit() !== 'err') goNext(); }
  else if (k === 'Escape') closeInput();
  else return;
  e.preventDefault();
});
document.addEventListener('touchstart', function () {}, { passive: true });   // iOSで:activeを効かせる
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (typeof SY !== 'undefined') { if (SY.pending) runSync(); else pullSheet().then(function (g) { afterPull(g); }); }
  var today = todayStr();
  if (screen === 'start') { renderStart(); return; }
  if (screen === 'main' && S && S.date !== today && S.ack !== today && !inp && !layers.length) {
    if (hasEntries(S)) show('start'); else { S.date = today; saveSession(); renderMain(); }
  }
});
window.addEventListener('resize', measureTop);
if (window.ResizeObserver) new ResizeObserver(measureTop).observe($('#main-top'));

/* ================= 表の内容の反映（1回だけ） ================= */
/* すでに使っている iPad の設定へ、店舗で記入した表の内容（単位・保管場所・発注目安・購入先）を反映する。
   入力途中の数量は、新しい保管場所へ移す。自分で追加した項目には触れない */
function applySheet() {
  SHEET.forEach(function (s) {
    var it = itemById(s[0]); if (!it || it.cat === 'cash') return;
    var fresh = sheetItem(M, s);
    if (it.id === 'f01' && (it.name === 'アサイー作り置き' || it.name === 'アサイー瓶詰')) it.name = fresh.name;
    if (!fresh.active) { it.active = false; return; }
    it.unit = fresh.unit; it.req = fresh.req; it.locs = fresh.locs; it.atLeast = fresh.atLeast; sortLocs(it);
    if (!it.memo) it.memo = fresh.memo;
    migrateEntries(it);
  });
  CASH.forEach(function (c) { var it = itemById(c.id); if (it && (!it.memo || it.memo === c.old)) it.memo = c.memo; });
  saveMaster();
}
/* 表の「在庫」欄を、最初の在庫確認で表示する「前回の数量」にする（その項目の前回の数量がまだ無い場合だけ） */
function seedPrev() {
  SHEET.forEach(function (s) {
    if (s[7] === null) return;
    var it = itemById(s[0]); if (!it || !it.active) return;
    var ks = keysOf(it); if (ks.length !== 1) return;
    if (P.entries[it.id] && Object.keys(P.entries[it.id]).length) return;
    P.entries[it.id] = {};
    P.entries[it.id][ks[0]] = { q: s[7], u: it.unit || idByName(M.units, s[2], 'u'), d: null };
  });
  savePrev();
}

/* ================= 起動 ================= */
if (!checkStorage()) { storageOK = false; $('#st-warn').hidden = false; }
(function () {
  var ver = lsGet(K_SEED) || 1;
  if (ver >= SEED_VER) return;
  if (lsGet(K_MASTER)) {
    if (ver < 2) applySheet();                 // 表の登録（全体）
    else {                                     // 表の登録済みの iPad には、訂正分だけを当てる
      var a = itemById('f01');
      if (a) {
        if (a.name === 'アサイー瓶詰') a.name = 'アサイー原料';
        if (a.req && a.req.q === 1 && uName(a.req.u) === '箱') a.req = { q: 1, u: idByName(M.units, 'ケース', 'u') };   // まだ「1箱」のままなら
      }
      if (ver < 6) ['s01', 's02', 's03', 's04', 's05', 's06', 's07'].forEach(function (id) {   // 袋の備品：「6袋以上」でまとめて表示、発注目安は5袋
        var x = itemById(id); if (!x || x.cat === 'cash') return;
        var bag = idByName(M.units, '袋', 'u');
        x.atLeast = 6; x.req = { q: 5, u: bag }; if (!x.unit) x.unit = bag;
      });
      var b = itemById('f06');
      if (b && b.locs.map(lName).join(',') === '棚上,冷蔵庫内') {   // まだ登録したときの2か所のままなら
        b.locs = [idByName(M.locs, '棚上', 'l')];
        migrateEntries(b);
      }
      saveMaster();
    }
  }
  seedPrev();                                  // 前回の数量が無い項目だけ（チョコソースの在庫5など）
  lsSet(K_SEED, SEED_VER);
})();
if (!lsGet(K_MASTER)) saveMaster();
route();
pullSheet(true).then(function (g) { afterPull(g); });   // 開いたときに、事務所のパソコンで直された在庫数を取り込む
setInterval(function () {   // 開いている間は2分おきに確かめる（入力中は確かめない）
  if (document.visibilityState === 'visible' && !inp && !syncBusy) pullSheet().then(function (g) { afterPull(g); });
}, 120000);
photoLoadAll().then(function () { if (screen === 'main') renderMain(); if (inp) renderInput(); }, function () {});
if (SY.pending) queueSync(1500);
window.addEventListener('online', function () { if (SY.pending) runSync(); });

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function () {
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      if (reg.active) reg.active.postMessage({ type: 'cache', url: location.href.split('#')[0] });
    }).catch(function () { /* sw.js が無い場合はオフライン対応なしで動く */ });
  });
}
})();
</script>
